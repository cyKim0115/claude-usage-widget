<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Usage</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="widget" id="widget" data-tauri-drag-region>
      <header class="header" data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Claude Usage</span>
        <span id="plan" class="plan" data-tauri-drag-region></span>
      </header>

      <!-- 트랙은 플랜에 따라 개수가 달라져서 main.ts가 채웁니다. -->
      <div class="tracks" id="tracks"></div>

      <footer class="footer" data-tauri-drag-region>
        <span id="status" class="status">loading…</span>
      </footer>
    </div>

    <div id="context-backdrop" class="context-backdrop hidden">
      <!-- 창이 160px 안팎까지 줄어들어서 항목이 늘면 메뉴가 잘립니다.
           나머지는 설정 창(settings.html)에 있습니다. -->
      <div id="context-menu" class="context-menu hidden">
        <button id="menu-settings" class="menu-item" type="button">설정</button>
        <button id="menu-quit" class="menu-item danger" type="button">종료</button>
      </div>
    </div>
  </body>
</html>
