<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* styles.css의 위젯용 투명 배경이 적용되기 전에 흰 화면이 번쩍이지 않게 미리 깔아둡니다. */
      body.settings-window-body {
        margin: 0;
        background: #16181c;
        color: #e8eaed;
      }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Usage — 설정</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings-window-body">
    <div class="settings-window">
      <header class="settings-header">
        <div class="settings-header-row">
          <h1>Claude Usage 설정</h1>
          <span id="connection-badge" class="settings-badge">—</span>
        </div>
        <p class="settings-subtitle">계정·위젯·앱 옵션을 한곳에서 관리합니다.</p>
      </header>

      <div id="action-status" class="settings-status hidden" role="status" aria-live="polite"></div>

      <section class="settings-card">
        <h2 class="settings-card-title">계정</h2>
        <p class="settings-hint">
          위젯은 Claude CLI가 저장한 자격증명을 읽습니다. 데스크톱 앱과 다른 계정으로
          로그인돼 있을 수 있어 여기서 확인합니다.
        </p>
        <div class="settings-field">
          <span class="settings-field-label" id="account-email">—</span>
          <p class="settings-detail" id="account-plan">불러오는 중…</p>
        </div>
        <div class="settings-actions">
          <button id="btn-refresh" class="btn secondary" type="button">사용량 새로고침</button>
        </div>
      </section>

      <section class="settings-card">
        <h2 class="settings-card-title">위젯</h2>
        <label class="settings-toggle">
          <input id="always-on-top-toggle" type="checkbox" />
          <span>항상 다른 창 위에 표시</span>
        </label>
        <p class="settings-hint">끄면 일반 창처럼 동작해 다른 창이 위젯 위로 올라올 수 있습니다.</p>
      </section>

      <section class="settings-card">
        <h2 class="settings-card-title">앱</h2>
        <label class="settings-toggle">
          <input id="autostart-toggle" type="checkbox" />
          <span>Windows 시작 시 자동 실행</span>
        </label>
        <p id="autostart-hint" class="settings-hint hidden"></p>
      </section>

      <footer class="settings-footer settings-footer--window">
        <button id="btn-close" class="btn primary wide" type="button">닫기</button>
      </footer>
    </div>
  </body>
</html>
