[package]
name = "claude-usage-widget"
version = "0.1.0"
description = "Desktop widget for Claude Code usage limits"
authors = ["cykim"]
edition = "2021"

[lib]
name = "claude_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
auto-launch = "0.5"
winreg = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
thiserror = "2"
tungstenite = "0.30"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows-version = "0.1"
# 유리 효과(glass.rs): Windows.UI.Composition으로 창 뒤 블러를 그리고 카드 모양대로 자릅니다.
# tauri가 쓰는 windows 0.61과 버전을 맞춥니다.
windows = { version = "0.61", features = [
  "Foundation_Numerics",
  "Graphics",
  "System",
  "UI_Composition_Desktop",
  "Win32_Graphics_Direct2D_Common",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-core = "0.61"
windows-numerics = "0.2"
