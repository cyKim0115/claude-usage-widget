[package]
name = "claude-usage-widget"
version = "0.1.0"
description = "Desktop widget for Claude Code usage limits"
authors = ["cykim"]
edition = "2021"

[lib]
name = "claude_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
auto-launch = "0.5"
winreg = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
thiserror = "2"
tungstenite = "0.30"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows-version = "0.1"
# 유리 효과(glass.rs): 위젯 뒤 화면을 캡처해 웹뷰로 넘깁니다. tauri가 쓰는 windows 0.61과 버전을 맞춥니다.
windows = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
